// NetLoom для Android: свой интерфейс на движке GeckoView.
// Сборка передаёт: -PgeckoviewVersion=… -PcompileSdkMajor=… -PcompileSdkMinor=… (их требует движок).
plugins {
    id "com.android.application"
}

def geckoviewVersion = providers.gradleProperty("geckoviewVersion").getOrElse("+")
def appVersion = providers.gradleProperty("appVersion").getOrElse(file("../../VERSION").text.trim())
def sdkMajor = providers.gradleProperty("compileSdkMajor").getOrElse("36").toInteger()
def sdkMinor = providers.gradleProperty("compileSdkMinor").getOrElse("0").toInteger()
def parts = appVersion.tokenize(".").collect { it.toInteger() }
def code = parts[0] * 10000 + parts[1] * 100 + parts[2]

android {
    namespace = "io.github.uproxe.netloom"
    compileSdk {
        version = release(sdkMajor) { minorApiLevel = sdkMinor }
    }

    defaultConfig {
        applicationId = "io.github.uproxe.netloom"
        minSdk = 26
        targetSdk = 34
        versionCode = code
        versionName = appVersion
        buildConfigField("String", "GECKOVIEW_VERSION", "\"${geckoviewVersion}\"")
        ndk { abiFilters.add(providers.gradleProperty("abi").getOrElse("arm64-v8a")) }
    }

    signingConfigs {
        release {
            def ks = System.getenv("NETLOOM_KEYSTORE")
            def pass = System.getenv("NETLOOM_KEYSTORE_PASSWORD") ?: "netloom-public"
            storeFile = file(ks ?: "../signing/netloom.jks")
            storePassword = pass
            keyAlias = System.getenv("NETLOOM_KEY_ALIAS") ?: "netloom"
            keyPassword = System.getenv("NETLOOM_KEY_PASSWORD") ?: pass
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // ядра VPN — обычные программы под именем lib*.so: Android разрешает запускать их из папки библиотек
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:${geckoviewVersion}"
    implementation "androidx.annotation:annotation:1.9.1"
}
