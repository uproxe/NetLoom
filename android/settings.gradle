pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // версию передаёт сборка (последняя стабильная), иначе — эта
        id "com.android.application" version providers.gradleProperty("agpVersion").getOrElse("9.1.0")
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://maven.mozilla.org/maven2/" }
    }
}
rootProject.name = "NetLoom"
include ":app"
