name: Предпросмотр интерфейса

# Запускает тот же движок Gecko ESR (Linux) с интерфейсом NetLoom в виртуальном экране
# и сохраняет снимки экрана. Нужен, чтобы быстро проверять дизайн без сборки движка.

on:
  workflow_dispatch:
  push:
    paths:
      - "ui/**"
      - "tools/apply-ui.sh"
      - "tools/ui-preview.sh"
      - ".github/workflows/ui-preview.yml"

permissions:
  contents: write

jobs:
  preview:
    name: Снимки интерфейса
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Пакеты
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y xvfb xdotool imagemagick libdbus-glib-1-2 fonts-noto-core fonts-noto-color-emoji

      - name: Движок для предпросмотра
        run: |
          V="$(bash engine/latest-version.sh)"
          echo "Gecko ESR $V"
          curl -fL --retry 5 -o engine.tar.xz "https://archive.mozilla.org/pub/firefox/releases/${V}esr/linux-x86_64/ru/firefox-${V}esr.tar.xz" \
            || curl -fL --retry 5 -o engine.tar.bz2 "https://archive.mozilla.org/pub/firefox/releases/${V}esr/linux-x86_64/ru/firefox-${V}esr.tar.bz2"
          if [ -f engine.tar.xz ]; then tar -xJf engine.tar.xz; else tar -xjf engine.tar.bz2; fi
          bash tools/apply-ui.sh firefox

      - name: Снимки
        run: bash tools/ui-preview.sh firefox preview

      - name: Снимки в ветку preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd preview
          cat > README.md <<MD
          # Снимки интерфейса NetLoom

          Коммит: ${GITHUB_SHA}

          ![окно](1-okno.png)
          ![сайт](2-sait.png)
          ![настройки](3-nastroiki.png)
          ![настройки, низ](4-nastroiki-niz.png)
          ![VPN](5-vpn.png)
          ![новая вкладка](6-novaya-vkladka.png)
          MD
          git init -q
          git checkout -q -b preview
          git add -A
          git -c user.name="uproxe" -c user.email="uproge@icloud.com" commit -q -m "Снимки интерфейса ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" preview
