name: Android

# Собирает NetLoom для Android: свой интерфейс на движке GeckoView + встроенный модуль
# (блокировка рекламы, защита от опасных сайтов, VPN) + ядра Xray и sing-box.
# Раз в неделю проверяет, не вышла ли новая версия движка, и пересобирает приложение.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ui/nlui/content/lib/**"
      - "tools/android-prepare.sh"
      - "VERSION"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apk:
    name: Приложение Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Версия движка GeckoView
        id: gv
        run: |
          GV="$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')"
          echo "GeckoView $GV"
          echo "version=$GV" >> "$GITHUB_OUTPUT"
          VER="$(cat VERSION)"; TAG="v$VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          LABEL="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"NetLoom-$VER-android-arm64.apk\") | .label")"
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "движок $GV)" <<<"$LABEL"; then
            echo "Приложение уже собрано на этом движке"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # какая версия Android SDK нужна движку
          curl -fsSL -o gv.aar "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/$GV/geckoview-$GV.aar"
          META="$(unzip -p gv.aar META-INF/com/android/build/gradle/aar-metadata.properties 2>/dev/null | tr -d '\r' || true)"
          rm -f gv.aar
          echo "$META"
          MAJOR="$(sed -n 's/^minCompileSdk=//p' <<<"$META")"; MINOR="$(sed -n 's/^minCompileMinorSdk=//p' <<<"$META")"
          echo "sdk_major=${MAJOR:-36}" >> "$GITHUB_OUTPUT"
          echo "sdk_minor=${MINOR:-0}" >> "$GITHUB_OUTPUT"
          # последние стабильные Android Gradle Plugin 9.x и Gradle 9.x
          AGP="$(curl -fsSL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -oP '(?<=<version>)9\.[0-9]+\.[0-9]+(?=</version>)' | sort -V | tail -1)"
          GRADLE="$(curl -fsSL https://services.gradle.org/versions/all \
            | python3 -c "import json,sys; v=[x['version'] for x in json.load(sys.stdin) if not (x['snapshot'] or x['nightly'] or x['releaseNightly'] or x['broken'] or x['rcFor'] or x['milestoneFor']) and x['version'].startswith('9.')]; print(sorted(v, key=lambda s: [int(p) for p in s.split('.')])[-1])")"
          echo "Android Gradle Plugin $AGP, Gradle $GRADLE"
          echo "agp=$AGP" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.gv.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gv.outputs.skip != 'true'
        with:
          gradle-version: ${{ steps.gv.outputs.gradle }}

      - name: Лицензии Android SDK
        if: steps.gv.outputs.skip != 'true'
        # нужные платформы и инструменты сборка скачает сама
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Библиотеки, фильтры и ядра VPN
        if: steps.gv.outputs.skip != 'true'
        run: bash tools/android-prepare.sh

      - name: Ключ подписи
        if: steps.gv.outputs.skip != 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/netloom.jks"
            echo "NETLOOM_KEYSTORE=$RUNNER_TEMP/netloom.jks" >> "$GITHUB_ENV"
            echo "NETLOOM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "NETLOOM_KEY_ALIAS=${KS_ALIAS:-netloom}" >> "$GITHUB_ENV"
            echo "Подпись: секретный ключ репозитория"
          else
            echo "Подпись: открытый ключ из android/signing"
          fi

      - name: Сборка
        if: steps.gv.outputs.skip != 'true'
        run: |
          gradle -p android --no-daemon --stacktrace assembleRelease \
            -PgeckoviewVersion="${{ steps.gv.outputs.version }}" \
            -PagpVersion="${{ steps.gv.outputs.agp }}" \
            -PcompileSdkMajor="${{ steps.gv.outputs.sdk_major }}" \
            -PcompileSdkMinor="${{ steps.gv.outputs.sdk_minor }}"
          VER="$(cat VERSION)"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NetLoom-$VER-android-arm64.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "dist/NetLoom-$VER-android-arm64.apk" | head -3
          "$BT/aapt2" dump badging "dist/NetLoom-$VER-android-arm64.apk" | grep -E "^package|sdkVersion|native-code" || true
          ls -la dist

      - name: Публикация
        if: steps.gv.outputs.skip != 'true'
        run: |
          VER="$(cat VERSION)"; TAG="${{ steps.gv.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "NetLoom $VER" --notes "Сборка идёт — файлы появятся здесь."
          fi
          gh release upload "$TAG" --clobber \
            "dist/NetLoom-$VER-android-arm64.apk#Android — телефоны с 64-битным процессором (движок ${{ steps.gv.outputs.version }})"
          bash tools/release-finish.sh "$TAG"

  emulator:
    name: Проверка на эмуляторе
    needs: apk
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Версии
        id: v
        run: |
          GV="$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')"
          curl -fsSL -o gv.aar "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/$GV/geckoview-$GV.aar"
          META="$(unzip -p gv.aar META-INF/com/android/build/gradle/aar-metadata.properties | tr -d '\r')"; rm -f gv.aar
          AGP="$(curl -fsSL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -oP '(?<=<version>)9\.[0-9]+\.[0-9]+(?=</version>)' | sort -V | tail -1)"
          GRADLE="$(curl -fsSL https://services.gradle.org/versions/all \
            | python3 -c "import json,sys; v=[x['version'] for x in json.load(sys.stdin) if not (x['snapshot'] or x['nightly'] or x['releaseNightly'] or x['broken'] or x['rcFor'] or x['milestoneFor']) and x['version'].startswith('9.')]; print(sorted(v, key=lambda s: [int(p) for p in s.split('.')])[-1])")"
          {
            echo "gv=$GV"; echo "agp=$AGP"; echo "gradle=$GRADLE"
            echo "sdk_major=$(sed -n 's/^minCompileSdk=//p' <<<"$META")"
            echo "sdk_minor=$(sed -n 's/^minCompileMinorSdk=//p' <<<"$META")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.v.outputs.gradle }}
      - name: Сборка для эмулятора (x86_64)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          bash tools/android-prepare.sh x86_64
          # тестовый «опасный» адрес — проверка блокировки
          printf '\n||danger-test.invalid^\n' >> android/app/src/main/assets/netloom/filters/urlhaus.txt
          gradle -p android --no-daemon assembleRelease -Pabi=x86_64 \
            -PgeckoviewVersion="${{ steps.v.outputs.gv }}" -PagpVersion="${{ steps.v.outputs.agp }}" \
            -PcompileSdkMajor="${{ steps.v.outputs.sdk_major }}" -PcompileSdkMinor="${{ steps.v.outputs.sdk_minor }}"
      - name: Доступ к виртуализации
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запуск на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-smoke.sh android/app/build/outputs/apk/release/app-release.apk shots
      - name: Снимки в ветку preview
        if: always()
        run: |
          [ -d shots ] && ls shots/*.png >/dev/null 2>&1 || exit 0
          # автор коммита — тот же, что у последнего коммита в main (владелец репозитория)
          git config user.name "$(git log -1 --format=%an origin/main)"
          git config user.email "$(git log -1 --format=%ae origin/main)"
          git worktree add -q /tmp/preview origin/preview || exit 0
          mkdir -p /tmp/preview/android && rm -f /tmp/preview/android/*.png
          cp shots/*.png /tmp/preview/android/
          cd /tmp/preview && git add -A android && git commit -qm "Снимки Android" && git push -q origin HEAD:preview || true
