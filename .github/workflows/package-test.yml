name: Проверка упаковки

# Проверяет сборку установщика Windows, пакета .deb и образа .dmg на поддельном
# «движке» — чтобы ошибки в упаковке находились сразу, а не после многочасовой сборки движка.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/package.sh"
      - "tools/windows/**"
      - "tools/linux/**"
      - "tools/macos/**"
      - ".github/workflows/package-test.yml"

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    name: Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get install -y nsis
      - name: Упаковка
        run: |
          mkdir -p fake/netloom/browser && cp /bin/true fake/netloom/netloom.exe
          (cd fake && zip -qr ../netloom-engine-0.0.1-win64.zip netloom)
          bash tools/package.sh win64 netloom-engine-0.0.1-win64.zip dist
          ls -la dist

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Упаковка
        run: |
          mkdir -p fake/netloom/browser && cp /bin/true fake/netloom/netloom
          tar -C fake -cJf netloom-engine-0.0.1-linux64.tar.xz netloom
          bash tools/package.sh linux64 netloom-engine-0.0.1-linux64.tar.xz dist
          dpkg-deb --contents dist/*.deb | head -20
          sudo dpkg -i --force-depends dist/*.deb && ls -la /usr/bin/netloom /usr/share/applications/netloom.desktop && sudo dpkg -r netloom

  mac:
    name: macOS (упаковка на Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Упаковка
        run: |
          MT="$HOME/mac-tools"; mkdir -p "$MT"
          TC="https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3"
          curl -fsSL "$TC.linux64-libdmg.latest/artifacts/public/build/dmg.tar.zst" | tar --zstd -x -C "$MT"
          curl -fsSL "$TC.linux64-hfsplus.latest/artifacts/public/build/hfsplus.tar.zst" | tar --zstd -x -C "$MT"
          # поддельный движок: вместо netloom — настоящая программа для macOS (ядро Xray), чтобы проверить подпись
          gh release download -R XTLS/Xray-core --pattern 'Xray-macos-arm64-v8a.zip' --dir xr
          unzip -q xr/*.zip -d xr
          APP="fake/NetLoom.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources/browser"
          cp xr/xray "$APP/MacOS/netloom"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleExecutable</key><string>netloom</string>' \
            '<key>CFBundleIdentifier</key><string>io.github.uproxe.netloom</string>' \
            '<key>CFBundleName</key><string>NetLoom</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>CFBundleIconFile</key><string>firefox.icns</string>' \
            '<key>CFBundleIconName</key><string>AppIcon</string>' \
            '</dict></plist>' > "$APP/Info.plist"
          dd if=/dev/zero of=fake.hfs bs=1M count=80 status=none
          "$MT/hfsplus/newfs_hfs" -v NetLoom fake.hfs
          "$MT/dmg/hfsplus" fake.hfs addall fake
          "$MT/dmg/dmg" build fake.hfs netloom-engine-0.0.1-mac-universal.dmg >/dev/null
          bash tools/package.sh mac netloom-engine-0.0.1-mac-universal.dmg dist
          # проверка результата
          "$MT/dmg/dmg" extract dist/*.dmg out.hfs >/dev/null
          mkdir out && "$MT/dmg/hfsplus" out.hfs extractall / out
          ls -la out out/NetLoom.app/Contents out/NetLoom.app/Contents/Resources out/NetLoom.app/Contents/Resources/cores/*
          ls -la out/NetLoom.app/Contents/_CodeSignature
          "$HOME/mac-tools/rcodesign" print-signature-info out/NetLoom.app/Contents/MacOS/netloom | head -20
          python3 -c "import plistlib; d=plistlib.load(open('out/NetLoom.app/Contents/Info.plist','rb')); print(d.get('CFBundleIconFile'), d.get('CFBundleIconName'))"
