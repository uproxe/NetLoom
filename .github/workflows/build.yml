name: Сборка NetLoom

# Собирает готовый браузер для людей: движок + интерфейс + ядра VPN + фильтры.
#   Windows — установщик .exe и архив .zip
#   Linux   — пакет .deb
#   macOS   — образ .dmg (Universal: Apple Silicon и Intel)
# Запускается после каждой сборки движка, при изменениях интерфейса и вручную.
# Android собирается отдельно (workflow «Android»), в тот же релиз.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Движок"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "tools/apply-ui.sh"
      - "tools/package.sh"
      - "tools/windows/**"
      - "tools/linux/**"
      - "tools/macos/**"
      - "VERSION"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Что собирать
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      win64: ${{ steps.p.outputs.win64 }}
      linux64: ${{ steps.p.outputs.linux64 }}
      mac: ${{ steps.p.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VER="$(cat VERSION)"; TAG="v$VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ENGINES="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name | startswith("engine-")) | .tag_name' | sort -V -r)"
          PACKED="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | \"\\(.name)\\t\\(.label)\\t\\(.updated_at)\"")"
          for p in win64 linux64 mac; do
            case $p in
              win64)   want='-win64\.zip$';         main="NetLoom-$VER-windows-x64-setup.exe" ;;
              linux64) want='-linux64\.tar\.[a-z0-9]+$'; main="netloom_${VER}_amd64.deb" ;;
              mac)     want='-mac-universal\.dmg$'; main="NetLoom-$VER-macos-universal.dmg" ;;
            esac
            found=""; engine_time=""
            for e in $ENGINES; do
              engine_time="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$e" --jq '.assets[] | "\(.name)\t\(.updated_at)"' | grep -E -e "${want%\$}"$'\t' | cut -f2 | head -1)"
              if [ -n "$engine_time" ]; then found="$e"; break; fi
            done
            if [ -z "$found" ]; then echo "$p: движок ещё не собран"; echo "$p=" >> "$GITHUB_OUTPUT"; continue; fi
            ev="${found#engine-}"
            label="$(awk -F'\t' -v n="$main" '$1 == n { print $2 }' <<<"$PACKED")"
            packed_time="$(awk -F'\t' -v n="$main" '$1 == n { print $3 }' <<<"$PACKED")"
            # пересобираем, если движок новее готового пакета (например, движок той же версии собран заново)
            if [ "$EVENT" = "workflow_run" ] && grep -q "движок $ev" <<<"$label" && [[ "$engine_time" < "$packed_time" ]]; then
              echo "$p: уже собран на движке $ev"; echo "$p=" >> "$GITHUB_OUTPUT"
            else
              echo "$p: собираю на движке $ev"; echo "$p=$found" >> "$GITHUB_OUTPUT"
            fi
          done
          # черновик: люди увидят релиз, когда в нём будут Windows, Linux и macOS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "NetLoom $VER" --notes "Сборка идёт — файлы появятся здесь."
          elif [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" ] && [ -z "$PACKED" ]; then
            gh release edit "$TAG" --draft=true   # пустой релиз не показываем
          fi

  windows:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.win64 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: NSIS
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get install -y nsis zip unzip
      - name: Движок
        run: gh release download "${{ needs.prepare.outputs.win64 }}" --dir engine-dl --pattern '*-win64.zip' --pattern '*-win64.ru.langpack.xpi'
      - name: Сборка
        run: bash tools/package.sh win64 "$(ls engine-dl/netloom-engine-*-win64.zip | head -1)" dist
      - name: Публикация
        run: |
          VER="$(cat VERSION)"; EV="$(cat dist/ENGINE_VERSION)"
          gh release upload "${{ needs.prepare.outputs.tag }}" --clobber \
            "dist/NetLoom-$VER-windows-x64-setup.exe#Windows — установщик (движок $EV)" \
            "dist/NetLoom-$VER-windows-x64.zip#Windows — без установки, архив (движок $EV)"

  linux:
    name: Linux
    needs: prepare
    if: needs.prepare.outputs.linux64 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Движок
        run: gh release download "${{ needs.prepare.outputs.linux64 }}" --dir engine-dl --pattern '*-linux64.tar.*' --pattern '*-linux64.ru.langpack.xpi'
      - name: Сборка
        run: bash tools/package.sh linux64 "$(ls engine-dl/netloom-engine-*-linux64.tar.* | head -1)" dist
      - name: Проверка пакета
        run: |
          VER="$(cat VERSION)"
          dpkg-deb --info "dist/netloom_${VER}_amd64.deb"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y "./dist/netloom_${VER}_amd64.deb"
          ls -la /usr/bin/netloom /usr/lib/netloom | head
          timeout 120 netloom --headless --screenshot /tmp/shot.png about:blank && ls -la /tmp/shot.png || echo '::warning::проверочный запуск не удался'
          sudo apt-get remove -y netloom
      - name: Публикация
        run: |
          VER="$(cat VERSION)"; EV="$(cat dist/ENGINE_VERSION)"
          gh release upload "${{ needs.prepare.outputs.tag }}" --clobber \
            "dist/netloom_${VER}_amd64.deb#Linux — пакет .deb для Ubuntu, Debian, Mint, elementary OS (движок $EV)"

  mac:
    name: macOS
    needs: prepare
    if: needs.prepare.outputs.mac != ''
    # образ для macOS собирается на Linux инструментами Mozilla (как у неё самой)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Движок
        run: gh release download "${{ needs.prepare.outputs.mac }}" --dir engine-dl --pattern '*-mac-universal.dmg' --pattern '*-mac-arm64.ru.langpack.xpi'
      - name: Сборка
        run: bash tools/package.sh mac "$(ls engine-dl/netloom-engine-*-mac-universal.dmg | head -1)" dist
      - name: Проверка образа
        run: |
          VER="$(cat VERSION)"; MT="$HOME/mac-tools"
          "$MT/dmg/dmg" extract "dist/NetLoom-$VER-macos-universal.dmg" check.hfs >/dev/null
          mkdir check && "$MT/dmg/hfsplus" check.hfs extractall / check
          ls -la check check/NetLoom.app/Contents/MacOS | head -20
          "$MT/cctools/bin/x86_64-apple-darwin-lipo" -info check/NetLoom.app/Contents/MacOS/netloom
          "$MT/rcodesign" print-signature-info check/NetLoom.app/Contents/MacOS/netloom | grep -iE "flags|identifier|cdhash" | head -5 || true
      - name: Публикация
        run: |
          VER="$(cat VERSION)"; EV="$(cat dist/ENGINE_VERSION)"
          gh release upload "${{ needs.prepare.outputs.tag }}" --clobber \
            "dist/NetLoom-$VER-macos-universal.dmg#macOS — Apple Silicon и Intel (движок $EV)"

  notes:
    name: Описание релиза
    needs: [prepare, windows, linux, mac]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Описание и публикация
        run: bash tools/release-finish.sh "${{ needs.prepare.outputs.tag }}"
